name: Vercel Deploy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Preview to Vercel
        id: vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}          # Required
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}        # Required
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}# Required
          working-directory: ./app
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Preview URL
        run: |
          echo "Preview URL: ${{ steps.vercel.outputs.preview-url }}"
          echo "Preview URL: ${{ steps.vercel.outputs.preview-url }}" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Production to Vercel
        id: vercel_prod
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./app
          scope: ${{ secrets.VERCEL_ORG_ID }}
          vercel-args: '--prod'

      - name: Production URL
        run: |
          echo "Production URL: ${{ steps.vercel_prod.outputs.preview-url }}"
          echo "Production URL: ${{ steps.vercel_prod.outputs.preview-url }}" >> $GITHUB_STEP_SUMMARY
